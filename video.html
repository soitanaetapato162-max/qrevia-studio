
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QREVIA Studio | AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:white;font-family:Arial,sans-serif}
header{background:#17142d;text-align:center;padding:25px 15px}
h1{color:#c6a7ff;margin:0}
main{max-width:650px;margin:25px auto;padding:16px}
.panel{background:#1d2035;border-radius:18px;padding:22px}
label{display:block;font-weight:bold;margin:20px 0 9px}
input,textarea,select{
width:100%;padding:14px;border-radius:10px;
background:#111426;color:white;border:1px solid #565573;
font-size:16px
}
textarea{min-height:115px;resize:vertical}
button{
width:100%;padding:16px;margin-top:20px;
border:0;border-radius:12px;background:#8654ee;
color:white;font-size:17px;font-weight:bold
}
button:disabled{opacity:.5}
video,img{width:100%;margin-top:15px;border-radius:12px}
small{color:#c4c4d5}
a{color:#c6a7ff}
#status{margin-top:18px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>QREVIA Studio</h1>
<p>AI Video Studio</p>
</header>
<main>
<div class="panel">
<h2>Create Your AI Video</h2>
<p>Describe a video or select your own photo or video.</p>

<label for="mode">Creation mode</label>
<select id="mode">
<option value="text">Text to Video</option>
<option value="photo">Photo to Video</option>
<option value="video">Video to Video</option>
</select>

<label for="upload">Upload photo or video (optional)</label>
<input id="upload" type="file" accept="image/*,video/*">
<small>Photo and video preview supported.</small>

<div id="preview"></div>

<label for="prompt">Describe your video</label>
<textarea id="prompt" placeholder="Example: A cinematic lion walking through a golden African palace, realistic movement, dramatic lighting."></textarea>

<label for="duration">Video duration</label>
<select id="duration">
<option value="5">5 seconds</option>
<option value="10">10 seconds</option>
</select>

<label for="format">Video format</label>
<select id="format">
<option value="portrait">Portrait 9:16</option>
<option value="landscape">Landscape 16:9</option>
</select>

<button id="generate" type="button">Generate AI Video</button>
<p id="status" role="status"></p>

<p style="text-align:center">
<a href="index.html">Home</a> |
<a href="image.html">AI Image Generator</a> |
<a href="edit-image.html">AI Photo Editor</a>
</p>
</div>
</main>

<script>
const upload=document.getElementById("upload");
const preview=document.getElementById("preview");
const mode=document.getElementById("mode");
const statusText=document.getElementById("status");
let previewUrl=null;

upload.addEventListener("change",()=>{
  preview.innerHTML="";
  statusText.textContent="";
  if(previewUrl) URL.revokeObjectURL(previewUrl);

  const file=upload.files[0];
  if(!file)return;

  previewUrl=URL.createObjectURL(file);
  const media=document.createElement(
    file.type.startsWith("video/")?"video":"img"
  );
  media.src=previewUrl;
  if(media.tagName==="VIDEO"){
    media.controls=true;
    media.playsInline=true;
  }
  preview.appendChild(media);
});

document.getElementById("generate").addEventListener("click",async ()=>{
  const prompt=document.getElementById("prompt").value.trim();
  const file=upload.files[0];

  if(!prompt){
    statusText.textContent="Please describe your video.";
    return;
  }
  if(mode.value==="photo" && (!file || !file.type.startsWith("image/"))){
    statusText.textContent="Please upload a photo.";
    return;
  }
  if(mode.value==="video" && (!file || !file.type.startsWith("video/"))){
    statusText.textContent="Please upload a video.";
    return;
  }

  statusText.textContent="Connecting to AI video generator...";
   try {
  const response = await fetch("/.netlify/functions/generate-video", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      prompt,
      duration: document.getElementById("duration").value,
      format: document.getElementById("format").value
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Video generation failed");
  }

 statusText.textContent = data.message || "Video is processing";

if (data.id && !data.videoUrl) {
  const videoId = data.id;

  const checkVideo = async () => {
    try {
      const res = await fetch(
        "/.netlify/functions/generate-video?id=" + encodeURIComponent(videoId)
      );
      const result = await res.json();

      if (!res.ok) throw new Error(result.error || "Video check failed");

      if (result.videoUrl) {
       statusText.textContent = "Video URL: " + result.videoUrl;
        const video = document.createElement("video");
        video.src = result.videoUrl;
        video.controls = true;
        video.style.width = "100%";
        statusText.after(video);
      } else if (result.status === "failed") {
       
statusText.textContent = "Video failed. Google response: " + JSON.stringify(result).slice(0, 1000);


      } else {
        statusText.textContent = result.message || "Video is processing";
        setTimeout(checkVideo, 5000);
      }
    } catch (error) {
      statusText.textContent = error.message;
    }
  };

  setTimeout(checkVideo, 5000);
}  
} catch (error) {
  statusText.textContent = error.message;
} 
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account | QREVIA Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1b;color:white;font-family:Arial,sans-serif;padding:24px}
.card{max-width:460px;margin:55px auto;background:#141d30;padding:28px;border-radius:18px}
h1{color:#9b8cff}
p{color:#b7c3d9;overflow-wrap:anywhere}
button,a.btn{display:block;width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#8066ff;color:white;text-align:center;text-decoration:none;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
</style>
</head>
<body>
<div class="card">
<h1>My Account</h1>
<p id="status">Checking your login...</p>
<div id="details" hidden>
<p><strong>Email:</strong> <span id="email"></span></p>
<p><strong>Subscription:</strong> Check billing status</p>
<a class="btn" href="/index.html">Back to Dashboard</a>
<button id="logout">Log Out</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://slccglpnidvkpjjjwnit.supabase.co";
const SUPABASE_KEY = "sb_publishable_E08YJQlfCan8kpSgLohwDg_A0zDJzOy";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function checkAccount(){
  const status=document.getElementById("status");
  try{
    const {data,error}=await db.auth.getUser();
    if(error || !data.user){
      window.location.replace("/login.html");
      return;
    }
    document.getElementById("email").textContent=data.user.email || "Not available";
    status.textContent="You are logged in.";
    document.getElementById("details").hidden=false;
  }catch(e){
    status.textContent="Unable to check your account. Please refresh.";
  }
}

document.getElementById("logout").addEventListener("click",async()=>{
  const button=document.getElementById("logout");
  button.disabled=true;
  try{
    const {error}=await db.auth.signOut();
    if(error) throw error;
    sessionStorage.removeItem("qrevia_logged_in");
    window.location.replace("/login.html");
  }catch(e){
    document.getElementById("status").textContent="Logout failed. Please try again.";
    button.disabled=false;
  }
});
const upgrade = document.createElement("button");
upgrade.textContent = "Upgrade to Pro — $12/month";
upgrade.disabled = true;
document.getElementById("details").appendChild(upgrade);
checkAccount();
</script>
</body>
</html>

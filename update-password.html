
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | QREVIA Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center;
      justify-content: center;
      background: #090e1b;
      color: white; font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: #141d30; padding: 30px;
      border-radius: 20px; width: 100%;
      max-width: 420px;
    }
    h1 { color: #9b8cff; text-align: center; }
    p { color: #aab4ca; text-align: center; }
    input, button {
      width: 100%; padding: 15px;
      margin: 10px 0; border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #0b1222; color: white;
      border: 1px solid #35405b;
    }
    button {
      background: #8066ff; color: white;
      border: 0; font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✦ QREVIA Studio</h1>
    <p>Choose your new password</p>
    <form id="resetForm">
      <input id="password" type="password"
        placeholder="New password" minlength="8"
        autocomplete="new-password" required>
      <input id="confirm" type="password"
        placeholder="Confirm new password"
        autocomplete="new-password" required>
      <button id="submit" type="submit">
        Update Password
      </button>
    </form>
    <p id="message" role="status">
      Verifying your reset link...
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://slccglpnidvkpjjjwnit.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_E08YJQlfCan8kpSgLohwDg_A0zDJzOy";
    const db = supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const msg = document.getElementById("message");
    const button = document.getElementById("submit");
    const form = document.getElementById("resetForm");
    let recoveryReady = false;

    button.disabled = true;

    db.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        button.disabled = false;
        msg.textContent = "Enter your new password.";
      }
    });

    async function checkRecovery() {
      const params = new URLSearchParams(
        window.location.search
      );
      const code = params.get("code");

      if (code) {
        const { error } =
          await db.auth.exchangeCodeForSession(code);
        if (error) {
          msg.textContent = error.message;
          return;
        }
        recoveryReady = true;
        button.disabled = false;
        msg.textContent = "Enter your new password.";
        return;
      }

      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );

      if (hash.get("error_description")) {
        msg.textContent = hash.get("error_description");
        return;
      }

      if (hash.get("type") === "recovery" &&
          hash.get("access_token") &&
          hash.get("refresh_token")) {
        const { error } = await db.auth.setSession({
          access_token: hash.get("access_token"),
          refresh_token: hash.get("refresh_token")
        });
        if (error) {
          msg.textContent = error.message;
          return;
        }
        recoveryReady = true;
        button.disabled = false;
        msg.textContent = "Enter your new password.";
        return;
      }

      msg.textContent =
        "Open this page using your password reset email link.";
    }

    checkRecovery();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        msg.textContent = "Use a valid reset email link.";
        return;
      }

      const password =
        document.getElementById("password").value;
      const confirm =
        document.getElementById("confirm").value;

      if (password !== confirm) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      msg.textContent = "Updating password...";

      const { error } = await db.auth.updateUser({
        password
      });

      if (error) {
        msg.textContent = error.message;
        button.disabled = false;
      } else {
        msg.textContent =
          "Password updated! You can now log in.";
        await db.auth.signOut();
      }
    });
  </script>
</body>
</html>

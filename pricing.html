
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QREVIA Studio — Pricing</title>
<style>
body{margin:0;background:#090e1b;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:28px;font-size:26px;font-weight:bold}
main{max-width:440px;margin:35px auto;padding:20px}
.card{background:#172139;border:1px solid #334155;border-radius:20px;padding:35px 20px}
h1{font-size:30px}
.price{font-size:48px;font-weight:bold;margin:25px 0}
.price span{font-size:17px;color:#aab4c8}
p{color:#cbd5e1;line-height:1.7}
button{background:#2563eb;color:white;border:0;border-radius:12px;padding:17px 25px;font-size:18px;font-weight:bold;width:100%;cursor:pointer}
a{color:#93c5fd}
footer{padding:25px;font-size:13px}
</style>
</head>
<body>
<header>✦ QREVIA Studio</header>
<main>
<div class="card">
<h1>Upgrade to QREVIA Pro</h1>
<div class="price">$12.00 <span>/ month</span></div>
<p>AI captions, hashtags, titles and descriptions</p>
<p>AI image generation and editing</p>
<p>AI-powered creative tools</p>
<p>Cancel your subscription anytime</p>
<button id="checkoutBtn" disabled onclick="startCheckout()">Subscribe Now — $12/month (Coming Soon)</button>
<p>Secure checkout coming soon</p>
</div>
</main>
<footer>
<a href="/legal.html">Terms · Privacy · Refund Policy</a>
</footer>
  <script>
async function startCheckout() {
  const button = document.getElementById("checkoutBtn");
  button.disabled = true;
  button.textContent = "Opening secure checkout...";

  try {
    const response = await fetch("/.netlify/functions/paddle-checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok || !data.checkoutUrl) {
  throw new Error(data.details || data.error || "Checkout unavailable");
    }

    window.location.href = data.checkoutUrl;
  } catch (error) {
    alert("Checkout is not ready yet: " + error.message);
    button.disabled = false;
  button.textContent = "Subscribe Now — $12/month";
  }
}
</script>
</body>
</html>
